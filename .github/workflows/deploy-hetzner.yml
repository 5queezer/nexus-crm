name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/deploy-hetzner.yml"
      - ".github/workflows/recover-production-db.yml"
      - ".github/workflows/container-smoke.yml"
  workflow_dispatch:

concurrency:
  group: nexus-production-transition
  # A newer push must not interrupt a backup or production transition.
  cancel-in-progress: false

env:
  COOLIFY_APP_DIR: ${{ vars.HETZNER_COOLIFY_APP_DIR }}
  COOLIFY_APP_DIR_DEFAULT: >-
    /data/coolify/applications/tj4r2ezipwho1zvjhg78a5wu
  COOLIFY_SERVICE: ${{ vars.HETZNER_COOLIFY_SERVICE }}
  COOLIFY_IMAGE: ${{ vars.HETZNER_COOLIFY_IMAGE }}
  COOLIFY_IMAGE_DEFAULT: tj4r2ezipwho1zvjhg78a5wu
  DEPLOY_PLATFORM: linux/arm64
  AUTO_DEPLOY: ${{ vars.HETZNER_AUTO_DEPLOY || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.HETZNER_AUTO_DEPLOY == 'true'
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Normalize deploy env
        run: |
          set -euo pipefail
          echo "COOLIFY_APP_DIR=${COOLIFY_APP_DIR:-$COOLIFY_APP_DIR_DEFAULT}" \
            >> "$GITHUB_ENV"
          echo "COOLIFY_IMAGE=${COOLIFY_IMAGE:-$COOLIFY_IMAGE_DEFAULT}" \
            >> "$GITHUB_ENV"

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image in GitHub Actions
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          image_tag="${COOLIFY_IMAGE}:${DEPLOY_SHA}"
          image_archive="/tmp/nexus-crm-${DEPLOY_SHA}.tar.gz"

          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "IMAGE_ARCHIVE=${image_archive}" >> "$GITHUB_ENV"

          docker buildx build \
            --platform "${DEPLOY_PLATFORM}" \
            --tag "${image_tag}" \
            --load \
            .

          docker save "${image_tag}" | gzip -1 > "${image_archive}"
          ls -lh "${image_archive}"

      - name: Configure SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || secrets.SSH_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY || secrets.SSH_KEY }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
        run: |
          set -euo pipefail

          : "${HETZNER_HOST:?Missing HETZNER_HOST/SSH_HOST secret}"
          : "${HETZNER_SSH_KEY:?Missing HETZNER_SSH_KEY/SSH_KEY secret}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "${HETZNER_SSH_KEY}" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key
          ssh-keyscan \
            -p "${HETZNER_PORT}" \
            "${HETZNER_HOST}" \
            >> ~/.ssh/known_hosts

      - name: Copy image to Hetzner VPS
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || secrets.SSH_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || secrets.SSH_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${HETZNER_USER:?Missing HETZNER_USER/SSH_USER secret}"
          remote_archive="/tmp/nexus-crm-${DEPLOY_SHA}.tar.gz"

          scp \
            -i ~/.ssh/hetzner_deploy_key \
            -P "${HETZNER_PORT}" \
            "${IMAGE_ARCHIVE}" \
            "${HETZNER_USER}@${HETZNER_HOST}:${remote_archive}"

      - name: Load image and deploy on Hetzner VPS
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || secrets.SSH_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || secrets.SSH_USER }}
          HETZNER_PORT: ${{ secrets.HETZNER_PORT || '22' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          remote_archive="/tmp/nexus-crm-${DEPLOY_SHA}.tar.gz"
          remote_env="COOLIFY_APP_DIR=$(printf '%q' "${COOLIFY_APP_DIR}")"
          remote_env+=" COOLIFY_SERVICE=$(printf '%q' "${COOLIFY_SERVICE}")"
          remote_env+=" COOLIFY_IMAGE=$(printf '%q' "${COOLIFY_IMAGE}")"
          remote_env+=" DEPLOY_SHA=$(printf '%q' "${DEPLOY_SHA}")"
          remote_env+=" IMAGE_ARCHIVE=$(printf '%q' "${remote_archive}")"

          ssh \
            -i ~/.ssh/hetzner_deploy_key \
            -p "${HETZNER_PORT}" \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "${remote_env} bash -s" <<'REMOTE'
          set -euo pipefail

          gzip -dc "${IMAGE_ARCHIVE}" | docker load
          rm -f "${IMAGE_ARCHIVE}"

          cd "${COOLIFY_APP_DIR}"

          # A previous interrupted deploy may have left the generated compose
          # file invalid. Recover the newest valid snapshot before inspecting it.
          if ! docker compose -f docker-compose.yaml \
            config --quiet >/dev/null 2>&1; then
            recovered=""
            for candidate in $(ls -1t \
              docker-compose.yaml.before-* 2>/dev/null || true); do
              if docker compose -f "${candidate}" \
                config --quiet >/dev/null 2>&1; then
                cp "${candidate}" docker-compose.yaml
                recovered="${candidate}"
                echo "Recovered docker-compose.yaml from ${candidate}."
                break
              fi
            done
            if [ -z "${recovered}" ]; then
              echo "docker-compose.yaml is invalid and has no valid backup."
              exit 1
            fi
          fi

          COOLIFY_SERVICE=$(python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          configured = os.environ.get("COOLIFY_SERVICE", "").strip()
          services = []
          for line in Path("docker-compose.yaml").read_text().splitlines():
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())
              if indent == 4 and stripped.endswith(":"):
                  services.append(stripped[:-1])

          if configured and configured in services:
              print(configured)
          elif services:
              if configured:
                  print(
                      "Configured Coolify service "
                      f"'{configured}' was not found; using "
                      f"'{services[0]}' from docker-compose.yaml.",
                      file=sys.stderr,
                  )
              print(services[0])
          PY
          )

          if [ -z "${COOLIFY_SERVICE:-}" ]; then
            echo "Could not determine Coolify compose service name." >&2
            exit 1
          fi

          export COOLIFY_SERVICE
          stamp="$(date +%Y%m%d%H%M%S)"
          backup="docker-compose.yaml.before-${DEPLOY_SHA}-${stamp}"
          cp docker-compose.yaml "${backup}"
          env_backup=""
          if [ -f .env ]; then
            env_backup=".env.before-${DEPLOY_SHA}-${stamp}"
            cp -p .env "${env_backup}"
            chmod 600 "${env_backup}"
          fi

          deployment_committed=0
          app_stopped=0
          transition_count_container="nexus-transition-count"
          transition_backup_container="nexus-transition-backup"
          transition_migration_container="nexus-transition-migration"

          cleanup_transition_containers() {
            for container in \
              "${transition_count_container}" \
              "${transition_backup_container}" \
              "${transition_migration_container}"
            do
              docker rm -f "${container}" >/dev/null 2>&1 || true
            done
          }

          compose_run_bounded() {
            container_name="$1"
            timeout_seconds="$2"
            shift 2
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
            if docker compose -f docker-compose.yaml run --rm -T --interactive=false --no-deps \
              --name "${container_name}" \
              --entrypoint timeout \
              "${COOLIFY_SERVICE}" "${timeout_seconds}" "$@"; then
              run_status=0
            else
              run_status=$?
            fi
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
            return "${run_status}"
          }

          # Kill any bounded transition container left by an interrupted SSH
          # session before this workflow acquired the shared transition lock.
          cleanup_transition_containers

          restore_pending_deploy() {
            rc=$?
            trap - EXIT
            cleanup_transition_containers
            if [ "${deployment_committed}" -ne 1 ]; then
              echo "Restoring pre-deploy Compose and environment state." >&2
              cp "${backup}" docker-compose.yaml
              if [ -n "${env_backup}" ]; then
                cp -p "${env_backup}" .env
              fi
              if [ "${app_stopped}" -eq 1 ]; then
                if ! docker compose -f docker-compose.yaml up -d "${COOLIFY_SERVICE}"; then
                  echo "Failed to restart the previous application image." >&2
                fi
              fi
            fi
            if [ -n "${env_backup}" ]; then
              rm -f "${env_backup}"
            fi
            exit "${rc}"
          }
          trap restore_pending_deploy EXIT

          python3 - <<'PY'
          import os
          from pathlib import Path

          compose_path = Path("docker-compose.yaml")
          env_path = Path(".env")
          service = os.environ["COOLIFY_SERVICE"]
          image = f"{os.environ['COOLIFY_IMAGE']}:{os.environ['DEPLOY_SHA']}"
          compose = compose_path.read_text()
          lines = compose.splitlines()

          in_service = False
          service_indent = None
          image_replaced = False
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped == f"{service}:":
                  in_service = True
                  service_indent = len(line) - len(line.lstrip())
                  out.append(line)
                  continue

              if in_service and service_indent is not None:
                  indent = len(line) - len(line.lstrip())
                  if stripped and indent <= service_indent:
                      in_service = False

                  if in_service and stripped.startswith("image:"):
                      out.append(f"        image: '{image}'")
                      image_replaced = True
                      continue

              out.append(line)

          if not image_replaced:
              raise SystemExit(f"Could not replace image for service {service}")

          compose_path.write_text("\n".join(out) + "\n")

          if env_path.exists():
              env_lines = env_path.read_text().splitlines()
              replaced = False
              for index, line in enumerate(env_lines):
                  if line.startswith("SOURCE_COMMIT="):
                      env_lines[index] = (
                          f"SOURCE_COMMIT={os.environ['DEPLOY_SHA']}"
                      )
                      replaced = True
                      break
              if not replaced:
                  env_lines.append(f"SOURCE_COMMIT={os.environ['DEPLOY_SHA']}")
              env_path.write_text("\n".join(env_lines) + "\n")
          PY

          if ! docker compose -f docker-compose.yaml config --quiet; then
            cp "${backup}" docker-compose.yaml
            echo "Generated compose file was invalid; restored ${backup}." >&2
            exit 1
          fi

          # The previous production incident occurred because the new image was
          # activated without applying its committed Prisma migration. Run all
          # database work through one-off containers so DATABASE_URL remains in
          # the compose environment and is never printed by GitHub Actions.
          db_count() {
            compose_run_bounded "${transition_count_container}" 120 \
              sh -c 'PG_DATABASE_URL="$(node /app/prisma/libpq-url.mjs)"; exec psql "$PG_DATABASE_URL" --no-psqlrc -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM \"Application\";"'
          }

          # Quiesce application and MCP writes so the PostgreSQL dump and the
          # generation-pinned document snapshot share one recovery boundary.
          app_stopped=1
          docker compose -f docker-compose.yaml stop --timeout 30 "${COOLIFY_SERVICE}"
          echo "Production writes quiesced for the recovery snapshot."

          count_before="$(db_count)"
          case "${count_before}" in
            ''|*[!0-9]*)
              echo "Could not verify the pre-migration application count." >&2
              exit 1
              ;;
          esac
          echo "Applications before migration: ${count_before}"

          backup_dir="${COOLIFY_APP_DIR}/database-backups"
          install -m 700 -d "${backup_dir}"
          backup_id="${stamp}-${DEPLOY_SHA}"

          # The target image performs the backup in a one-off container while
          # production writes are quiesced. DATABASE_URL, GCS_BUCKET,
          # credentials, and optional BACKUP_GCS_* settings are inherited from
          # the Compose service and never printed by Actions.
          if docker compose -f docker-compose.yaml run --rm -T --interactive=false --no-deps \
            --name "${transition_backup_container}" \
            --user 0:0 \
            --volume "${backup_dir}:/backups" \
            --env "BACKUP_ID=${backup_id}" \
            --env "SOURCE_COMMIT=${DEPLOY_SHA}" \
            --env "BACKUP_LOCAL_DIR=/backups" \
            --entrypoint timeout "${COOLIFY_SERVICE}" \
            1500 node /app/scripts/pre-deploy-backup.mjs; then
            backup_status=0
          else
            backup_status=$?
          fi
          docker rm -f "${transition_backup_container}" >/dev/null 2>&1 || true
          if [ "${backup_status}" -ne 0 ]; then
            exit "${backup_status}"
          fi
          echo "Verified pre-deploy database and document recovery set ${backup_id}."

          compose_run_bounded "${transition_migration_container}" 900 \
            node /app/prisma-cli/node_modules/prisma/build/index.js migrate deploy --schema=/app/prisma/schema.prisma

          count_after="$(db_count)"
          if [ "${count_after}" != "${count_before}" ]; then
            echo "Application count changed during additive migration; refusing to activate image." >&2
            exit 1
          fi
          echo "Applications after migration: ${count_after}"

          docker compose -f docker-compose.yaml up -d "${COOLIFY_SERVICE}"
          cleanup_transition_containers
          deployment_committed=1
          app_stopped=0
          if [ -n "${env_backup}" ]; then
            rm -f "${env_backup}"
            env_backup=""
          fi
          trap - EXIT
          ps_format="{{.Names}} {{.Image}} {{.Status}}"
          docker ps --filter "name=${COOLIFY_SERVICE}" --format "${ps_format}"
          REMOTE

  auto-deploy-disabled:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.HETZNER_AUTO_DEPLOY != 'true'
    steps:
      - run: |
          echo "Hetzner auto-deploy is disabled because GitHub SSH"
          echo "secrets are not verified."
          echo "Set repository variable HETZNER_AUTO_DEPLOY=true"
          echo "after fixing HETZNER_SSH_KEY/SSH_KEY."
